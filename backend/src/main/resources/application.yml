spring:
  config:
    # Auto-load .env whether backend is started from `backend/` or repo root.
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties]
  application:
    name: library-management
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    # Use env vars so credentials are not committed; defaults are local PostgreSQL.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/library_db?connectTimeout=10&socketTimeout=120&tcpKeepAlive=true}
    # Fall back to the JVM user.name system property (set by the OS on all platforms).
    # A final default of 'postgres' ensures the app can still start in environments
    # where user.name is unavailable (e.g., some CI containers).
    username: ${DB_USERNAME:${user.name:postgres}}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: LibraryHikariPool
      minimum-idle: 1
      maximum-pool-size: 5
      idle-timeout: 60000
      max-lifetime: 240000
      keepalive-time: 120000
      connection-timeout: 10000
      validation-timeout: 3000
      initialization-fail-timeout: 10000
      leak-detection-threshold: 60000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

logging:
  level:
    root: INFO
    com.comp3111: DEBUG

file:
  upload:
    # Uploaded book files are stored in PostgreSQL; no local PDF directory is required.
    max-size: 10485760
    allowed-extensions: pdf,txt,doc,docx

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash-lite

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

library:
  jwt:
    # Required, at least 32 bytes, no default. Generate with: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  borrow:
    # Loan length applied when a borrowing record is created.
    duration-days: 14
    # Grace period before a freshly borrowed book may be returned by the borrower.
    min-self-return-seconds: 30
