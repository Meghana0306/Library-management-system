<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Management System</title>
    <script>
      // Stamps the stored colour scheme before first paint so a dark-mode
      // reload never flashes the light paper background. Mirrors the key used
      // by localStorageColorSchemeManager in main.jsx.
      try {
        var stored = window.localStorage.getItem('library-color-scheme')
        var scheme = stored === 'dark' || stored === 'light' || stored === 'auto' ? stored : 'light'
        var computed =
          scheme !== 'auto'
            ? scheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-mantine-color-scheme', computed)
        document.documentElement.style.backgroundColor = computed === 'dark' ? '#151a17' : '#faf6ef'
      } catch (e) {
        /* storage unavailable — MantineProvider falls back to the light default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
